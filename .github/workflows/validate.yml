name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  marketplace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: marketplace.json matches generator output
        run: python3 .github/scripts/generate-marketplace.py --check

      - name: marketplace.json shape
        run: |
          set -euo pipefail
          manifest=.claude-plugin/marketplace.json

          jq empty "$manifest"

          test "$(jq -r '.name' "$manifest")" = "agency" \
            || { echo "::error::marketplace name must stay 'agency' (renaming forces mass reinstall)"; exit 1; }

          jq -e '.plugins and (.plugins | type == "array") and (.plugins | length > 0)' "$manifest" > /dev/null \
            || { echo "::error::marketplace.json missing non-empty 'plugins' array"; exit 1; }

          bad_names=$(jq -r '.plugins[].name' "$manifest" | grep -vE '^[a-z][a-z0-9]*(-[a-z0-9]+)*$' || true)
          [ -z "$bad_names" ] || { echo "::error::non-kebab-case plugin name(s): $bad_names"; exit 1; }

          dupes=$(jq -r '.plugins | map(.name) | group_by(.) | map(select(length > 1)) | flatten | unique | .[]' "$manifest" || true)
          [ -z "$dupes" ] || { echo "::error::duplicate plugin name(s): $dupes"; exit 1; }

      - name: source paths are relative and exist
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r src; do
            case "$src" in
              ./) echo "::error::source './' is forbidden (repo-root sources absorb every pooled agent/command)"; failed=1 ;;
              ./*) [ -e "$src" ] || { echo "::error::source path does not exist: $src"; failed=1; } ;;
              *) echo "::error::source must start with ./ : $src"; failed=1 ;;
            esac
          done < <(jq -r '.plugins[].source' .claude-plugin/marketplace.json)
          exit $failed

      - name: no broken symlinks in bundles or agent dirs
        run: |
          broken=$(find plugins agents -xtype l 2>/dev/null || true)
          [ -z "$broken" ] || { echo "::error::broken symlink(s):"; echo "$broken"; exit 1; }

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Validate plugin.json files
        run: |
          failed=0
          while IFS= read -r -d '' file; do
            if ! bash hooks/hooks-toolkit/scripts/validate-plugin-json.sh "$file"; then
              failed=$((failed + 1))
            fi
          done < <(find plugins -path '*/.claude-plugin/plugin.json' -print0)
          exit $failed

      - name: Validate SKILL.md frontmatter
        run: |
          failed=0
          while IFS= read -r -d '' file; do
            if ! bash hooks/hooks-toolkit/scripts/validate-skill-frontmatter.sh "$file"; then
              failed=$((failed + 1))
            fi
          done < <(find skills -name "SKILL.md" -print0)
          exit $failed
